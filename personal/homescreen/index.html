<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Linux Homescreen</title>
    <style>
        :root {
            color-scheme: dark;
            --text: #f6f8fb;
            --muted: rgba(246, 248, 251, 0.72);
            --line: rgba(255, 255, 255, 0.12);
            --shadow: 0 22px 60px rgba(0, 0, 0, 0.34);
            --purple: #8b45df;
            --purple-2: #a25af0;
            --blue: #255d88;
            --navy: #272a2f;
            --slate: #3c3f45;
            --light: #8d94d4;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
        }

        body {
            font-family: "Segoe UI Variable Display", "Segoe UI Variable", "Aptos", "Trebuchet MS", sans-serif;
            color: var(--text);
            overflow: hidden;
            background:
                radial-gradient(circle at 18% 10%, rgba(24, 90, 120, 0.68), transparent 28%),
                radial-gradient(circle at 80% 16%, rgba(181, 115, 62, 0.46), transparent 24%),
                linear-gradient(180deg, rgba(8, 12, 18, 0.18), rgba(8, 12, 18, 0.56)),
                linear-gradient(90deg, #182f39 0%, #0f1f2a 36%, #09131c 58%, #6a452e 100%);
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background:
                linear-gradient(180deg, rgba(0, 0, 0, 0.1), rgba(0, 0, 0, 0.3)),
                radial-gradient(circle at 50% 55%, rgba(13, 19, 27, 0.05), rgba(13, 19, 27, 0.58) 70%);
            pointer-events: none;
        }

        .screen {
            position: relative;
            width: 100%;
            height: 100%;
            padding: 44px 58px 32px;
            display: grid;
            grid-template-rows: auto auto 1fr auto;
            gap: 28px;
        }

        .topbar {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 18px;
            position: relative;
            z-index: 1;
        }

        .status-icon {
            width: 28px;
            height: 28px;
            color: rgba(255, 255, 255, 0.9);
            opacity: 0.92;
            flex: 0 0 auto;
        }

        .hero {
            display: grid;
            gap: 14px;
            align-content: start;
            position: relative;
            z-index: 1;
            max-width: 540px;
            padding-left: 4px;
        }

        .clock {
            font-size: clamp(5.2rem, 10vw, 8.2rem);
            line-height: 0.9;
            font-weight: 300;
            letter-spacing: -0.08em;
            text-shadow: 0 2px 22px rgba(0, 0, 0, 0.24);
        }

        .date {
            font-size: clamp(1.8rem, 3.1vw, 2.8rem);
            line-height: 1.05;
            font-weight: 700;
            letter-spacing: -0.04em;
        }

        .weather {
            display: grid;
            gap: 5px;
            margin-top: 2px;
        }

        .weather .city {
            font-size: 1.18rem;
            font-weight: 600;
            color: var(--muted);
        }

        .weather .summary {
            font-size: 1.02rem;
            color: rgba(255, 255, 255, 0.84);
        }

        .section-title {
            margin: 0 0 18px;
            font-size: clamp(1.9rem, 3vw, 3rem);
            line-height: 1;
            font-weight: 300;
            letter-spacing: -0.05em;
            color: rgba(255, 255, 255, 0.98);
        }

        .favorites {
            position: relative;
            z-index: 1;
        }

        .card-row {
            display: grid;
            grid-template-columns: repeat(5, minmax(0, 1fr));
            gap: 18px;
        }

        .app-card {
            min-height: 220px;
            border-radius: 26px;
            padding: 20px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            background: rgba(33, 35, 40, 0.92);
            box-shadow: var(--shadow);
            display: grid;
            grid-template-rows: 1fr auto;
            gap: 18px;
            text-decoration: none;
            color: var(--text);
            transition: transform 160ms ease, box-shadow 160ms ease, border-color 160ms ease;
        }

        .app-card:hover,
        .app-card:focus-visible {
            transform: translateY(-3px);
            border-width: 4px;
            border-color: #ffffff;
            outline: none;
        }

        .app-card.primary {
            background: linear-gradient(180deg, #8c45db 0%, #8038d4 100%);
            padding: 18px 18px 20px;
        }

        .app-card.kodi {
            background: #131313;
        }

        .app-card.plank {
            background: #33373d;
        }

        .app-card.discover {
            background: #235478;
        }

        .app-card.jellyfin {
            background: #8c96d8;
        }

        .app-icon {
            display: grid;
            place-items: center;
            align-self: center;
        }

        .app-icon img,
        .app-icon svg {
            width: min(118px, 76%);
            height: auto;
            display: block;
        }

        .app-name {
            font-size: 1.6rem;
            line-height: 1;
            text-align: center;
            letter-spacing: -0.03em;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.95);
        }

        @media (max-width: 1400px) {
            .card-row {
                grid-template-columns: repeat(3, minmax(0, 1fr));
            }
        }

        @media (max-width: 900px) {
            body {
                overflow: auto;
            }

            .screen {
                min-height: 100%;
                height: auto;
                padding: 26px 20px 28px;
                gap: 22px;
            }

            .card-row {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }

            .app-card {
                min-height: 180px;
            }
        }

        @media (max-width: 560px) {
            .topbar {
                gap: 12px;
                flex-wrap: wrap;
            }

            .hero {
                max-width: none;
            }

            .clock {
                font-size: clamp(4rem, 18vw, 5.6rem);
            }

            .date {
                font-size: clamp(1.45rem, 7vw, 2rem);
            }

            .card-row {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <main class="screen">
        <header class="topbar" aria-label="System status">
            <svg class="status-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 4v6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M7.2 6.2a7 7 0 1 0 9.6 0" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        </header>

        <section class="hero" aria-live="polite">
            <div class="clock" id="clock">--:--</div>
            <div class="date" id="date">Loading date</div>
            <div class="weather">
                <div class="city" id="weather-place">Waiting for network response</div>
                <div class="summary" id="weather-summary">Finding your location...</div>
                <div class="summary" id="weather-temp">--°</div>
            </div>
        </section>

        <section class="favorites" aria-label="Favorites">
            <h2 class="section-title">Favorites</h2>
            <div class="card-row">
                <a class="app-card primary" href="https://www.mozilla.org/firefox/" target="_blank" rel="noreferrer" aria-label="Open Firefox">
                    <div class="app-icon">
                        <img src="assets/icons/firefox.svg" alt="" aria-hidden="true">
                    </div>
                    <div class="app-name">Firefox</div>
                </a>

                <div class="app-card kodi" aria-label="Kodi">
                    <div class="app-icon">
                        <img src="assets/icons/kodi.svg" alt="" aria-hidden="true">
                    </div>
                    <div class="app-name">Kodi</div>
                </div>

                <div class="app-card plank" aria-label="Plank Player">
                    <div class="app-icon">
                        <img src="assets/icons/plank-player.svg" alt="" aria-hidden="true">
                    </div>
                    <div class="app-name">Plank Player</div>
                </div>

                <div class="app-card discover" aria-label="Discover">
                    <div class="app-icon">
                        <img src="assets/icons/discover.svg" alt="" aria-hidden="true">
                    </div>
                    <div class="app-name">Discover</div>
                </div>

                <div class="app-card jellyfin" aria-label="Jellyfin Media Player">
                    <div class="app-icon">
                        <img src="assets/icons/jellyfin.svg" alt="" aria-hidden="true">
                    </div>
                    <div class="app-name">Jellyfin Media Player</div>
                </div>
            </div>
        </section>

    </main>

    <script>
        const clockTarget = document.getElementById('clock');
        const dateTarget = document.getElementById('date');
        const weatherPlace = document.getElementById('weather-place');
        const weatherSummary = document.getElementById('weather-summary');
        const weatherTemp = document.getElementById('weather-temp');
        const weatherCacheKey = 'homescreen-weather-cache';
        const weatherCacheTtl = 2 * 60 * 60 * 1000;

        const timeFormatter = new Intl.DateTimeFormat('en', {
            hour: 'numeric',
            minute: '2-digit'
        });

        const dateFormatter = new Intl.DateTimeFormat('en', {
            month: 'long',
            day: 'numeric',
            year: 'numeric'
        });

        function refreshClock() {
            const now = new Date();
            clockTarget.textContent = timeFormatter.format(now).replace('AM', 'am').replace('PM', 'pm');
            dateTarget.textContent = dateFormatter.format(now);
        }

        function weatherLabel(code) {
            const labels = {
                0: 'Clear sky',
                1: 'Mainly clear',
                2: 'Partly cloudy',
                3: 'Overcast',
                45: 'Foggy',
                48: 'Rime fog',
                51: 'Light drizzle',
                53: 'Drizzle',
                55: 'Heavy drizzle',
                61: 'Light rain',
                63: 'Rain',
                65: 'Heavy rain',
                71: 'Light snow',
                73: 'Snow',
                75: 'Heavy snow',
                80: 'Rain showers',
                81: 'Rain showers',
                82: 'Heavy showers',
                95: 'Thunderstorm'
            };

            return labels[code] || 'Local conditions';
        }

        function readWeatherCache() {
            try {
                const cached = JSON.parse(localStorage.getItem(weatherCacheKey));
                if (!cached || typeof cached.savedAt !== 'number') {
                    return null;
                }

                if (Date.now() - cached.savedAt > weatherCacheTtl) {
                    return null;
                }

                return cached;
            } catch (error) {
                return null;
            }
        }

        function writeWeatherCache(data) {
            try {
                localStorage.setItem(weatherCacheKey, JSON.stringify({
                    ...data,
                    savedAt: Date.now()
                }));
            } catch (error) {
                // Ignore storage failures and fall back to live fetches.
            }
        }

        function applyWeatherState(state) {
            weatherPlace.textContent = state.place || 'Your area';
            weatherSummary.textContent = state.summary || 'Offline mode';
            weatherTemp.textContent = state.temp || '--°';
        }

        async function loadWeather() {
            const cachedWeather = readWeatherCache();
            if (cachedWeather) {
                applyWeatherState(cachedWeather);
                return;
            }

            if (!navigator.onLine) {
                applyWeatherState({
                    place: 'Your area',
                    summary: 'Offline mode',
                    temp: '--°'
                });
                return;
            }

            try {
                const locationResponse = await fetch('https://ipwho.is/');
                if (!locationResponse.ok) {
                    throw new Error('Location lookup failed');
                }

                const location = await locationResponse.json();
                if (!location.success || typeof location.latitude !== 'number' || typeof location.longitude !== 'number') {
                    throw new Error('Missing coordinates');
                }

                const place = [location.city || location.region || 'Your area', location.country || ''].filter(Boolean).join(', ');

                const weatherResponse = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${location.latitude}&longitude=${location.longitude}&current=temperature_2m,weather_code&timezone=auto`);
                if (!weatherResponse.ok) {
                    throw new Error('Weather lookup failed');
                }

                const weather = await weatherResponse.json();
                const state = {
                    place,
                    summary: weatherLabel(weather.current.weather_code),
                    temp: `${Math.round(weather.current.temperature_2m)}°`
                };

                applyWeatherState(state);
                writeWeatherCache(state);
            } catch (error) {
                applyWeatherState({
                    place: 'Your area',
                    summary: 'Offline mode',
                    temp: '--°'
                });
            }
        }

        refreshClock();
        loadWeather();
        setInterval(refreshClock, 1000);
    </script>
</body>
</html>

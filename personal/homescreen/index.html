<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="./assets/css/bootstrap.css">
    <link rel="stylesheet" href="./assets/css/style.css">
    <title>Homescreen</title>
</head>
<body>
    <main class="screen">
        <section class="hero" aria-live="polite">
            <div class="clock" id="clock">--:--</div>
            <div class="date" id="date">Loading date</div>
            <div class="weather">
                <div class="city" id="weather-place">Waiting for network response</div>
                <div class="summary" id="weather-summary">Finding your location...</div>
                <div class="summary" id="weather-temp">--°</div>
            </div>
        </section>

        <section class="favorites" aria-label="Favorites">
            <h2 class="section-title">Favorites</h2>
            <div class="card-row">
                <a class="app-card youtube" href="https://www.youtube.com/" rel="noreferrer" aria-label="Open YouTube" style="background-color: rgba(150, 20, 20, 0.92);">
                    <div class="app-icon">
                        <img src="assets/icons/youtube.svg" alt="" aria-hidden="true">
                    </div>
                    <div class="app-name">YouTube</div>
                </a>

                <a class="app-card netflix" href="https://www.netflix.com/" rel="noreferrer" aria-label="netflix" >
                    <div class="app-icon">
                        <img src="assets/icons/netflix.svg" alt="" aria-hidden="true">
                    </div>
                    <div class="app-name">Netflix</div>
                </a>
                

                <a class="app-card jellyfin" href="https://jellyfin.levi0725.hu/web/" rel="noreferrer" aria-label="Jellyfin Media Player">
                    <div class="app-icon">
                        <img src="assets/icons/jellyfin.svg" alt="" aria-hidden="true">
                    </div>
                    <div class="app-name">Jellyfin</div>
                </a>

                
                <a class="app-card blank" href="https://mozisarok.hu/" rel="noreferrer" aria-label="MoziSarok">
                    <div class="app-icon">
                        <img src="assets/icons/mozisarok.svg" alt="" aria-hidden="true">
                    </div>
                    <div class="app-name">MoziSarok</div>
                </a>

                <a class="app-card blank" href="https://tiktok.com/" rel="noreferrer" aria-label="TikTok" style="background-color: rgb(120 160 255 / 92%);">
                    <div class="app-icon">
                        <img src="assets/icons/tiktok.svg" alt="" aria-hidden="true">
                    </div>
                    <div class="app-name">TikTok</div>
                </a>
            </div>
            <p style="margin-top: 50px; color: rgb(200, 200, 200); font-size: 24px;" id="quote_p" align="center"></p>
        </section>

    </main>

    <script src="./assets/js/main.js"></script>
</body>
</html>

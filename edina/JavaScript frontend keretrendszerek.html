<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>JavaScript frontend keretrendszerek</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--tx:#1c2233;--mu:#5b6478;--ac:#4f46e5;--bd:#dfe3ee;--cb:#12172a;--ct:#e6e9f5;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1220;--card:#181c30;--tx:#eceffa;--mu:#9aa3bd;--ac:#8b85ff;--bd:#2a3050}}
:root[data-theme="dark"]{--bg:#0f1220;--card:#181c30;--tx:#eceffa;--mu:#9aa3bd;--ac:#8b85ff;--bd:#2a3050}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column}
main{flex:1;overflow-y:auto;padding:20px clamp(14px,4vw,48px)}
.s{display:none;max-width:1100px;margin:0 auto}.s.on{display:block}
h1{font-size:clamp(28px,6vw,52px);margin:.6em 0 .2em}
h2{font-size:clamp(22px,4vw,32px);margin:0 0 14px;color:var(--ac)}
h3{margin:0 0 6px;font-size:22px}
.lead{color:var(--mu);margin:0 0 10px}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:14px}
.c{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px}
.c ul{font-size:15px}ul{margin:0;padding-left:20px}li{margin:5px 0}
pre{background:var(--cb);color:var(--ct);border-radius:10px;padding:10px 12px;overflow-x:auto;font:13px/1.45 ui-monospace,Menlo,Consolas,monospace;margin:10px 0 0}
.t{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:14px;background:var(--card)}
th,td{border:1px solid var(--bd);padding:7px 9px;text-align:left;vertical-align:top}th{background:var(--ac);color:#fff}
nav{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 16px;border-top:1px solid var(--bd);background:var(--card)}
button{background:var(--ac);color:#fff;border:0;border-radius:8px;padding:8px 16px;font-size:15px;cursor:pointer}
#n{color:var(--mu);font-size:14px}
</style>
</head>
<body>
<main id="m"></main>
<nav><button id="p">← Előző</button><span id="n"></span><button id="x">Következő →</button></nav>
<script>
const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;');
const BIG={
'React':['A Meta (Facebook) <b>UI-könyvtára</b>. Az oldalt kis, önálló, újrahasználható <b>komponensekből</b> építjük fel, mint a LEGO-elemekből: egy gomb, egy kártya vagy egy teljes űrlap is lehet komponens.','dinamikus webappok és egyoldalas alkalmazások (SPA), például vezérlőpultok, közösségi felületek, admin rendszerek.','Megmondod, <b>hogyan nézzen ki</b> a felület egy adott állapotban. Ha az adat (state) változik, a React egy <b>virtuális DOM</b>-mal (memóriabeli másolat) kiszámolja a különbséget, és csak a megváltozott részt frissíti a böngészőben.','JSX (HTML-szerű szintaxis a JavaScriptben), hookok (useState, useEffect), egyirányú adatfolyam, hatalmas ökoszisztéma (router, állapotkezelők, UI-készletek).','a legnagyobb közösség és munkaerőpiac; rengeteg kész könyvtár és tananyag; rugalmas, sokféle projekthez illeszthető.','csak a felületet adja, az útválasztást, adatlekérést és szerkezetet magadnak kell összeválogatni; a sok választási lehetőség kezdőknek zavaró.','sok interakciót tartalmazó admin felület vagy webapp, ahol később sok fejlesztő fog dolgozni.'],
'Vue':['Egy <b>progresszív keretrendszer</b>: apránként bevezethető egy meglévő oldalba, de teljes appig is megnő. Egyszerű, HTML-hez közeli sablonokat írsz, a Vue pedig figyeli az adatokat.','kis widgettől (pl. kosárikon) teljes egyoldalas alkalmazásig; közepes üzleti webappok, portálok.','Az adatok <b>reaktívak</b> (ref, reactive): ha egy érték változik, a Vue tudja, mely sablonrészek használják, és csak azokat frissíti. A komponens egy .vue fájlban él: sablon, logika és stílus egy helyen.','.vue fájlok (template + script + style), direktívák (v-if, v-for, v-model), Composition API, hivatalos router (Vue Router) és állapotkezelő (Pinia).','nagyon barátságos tanulási görbe; kiváló dokumentáció; a HTML-hez szokott fejlesztőknek természetes.','kisebb munkaerőpiac, mint a Reacté; nagy csapatokban többféle írásmód (Options és Composition API) keveredhet.','első keretrendszerként, vagy 5-10 oldalas üzleti appnál, ahol gyorsan kell eredmény.'],
'Angular':['A Google <b>teljes körű keretrendszere</b>, TypeScripttel (típusos JavaScript). Nemcsak a felületet adja, hanem a szerkezetet is: mindent tartalmaz, ami egy nagy apphoz kell.','nagy, hosszú életű vállalati alkalmazások, sok fejlesztős csapatok, belső rendszerek.','A kód <b>komponensekre</b>, <b>szolgáltatásokra</b> és modulokra oszlik. A <b>dependency injection</b> (függőségek automatikus átadása) gondoskodik róla, hogy minden rész megkapja, amire szüksége van. A modern Angular <b>Signals</b>-szal követi az adatváltozást.','TypeScript kötelező, beépített router, űrlapkezelés, HTTP-kliens, tesztelés, parancssori eszköz (Angular CLI), szigorú konvenciók.','egységes szerkezet, ezért nagy csapatban is átlátható; mindent egy helyről kapsz; a típusosság kevesebb hibát jelent.','meredek tanulási görbe (sok fogalom); kisebb projekthez túl sok az előírt kód és szerkezet.','bank vagy biztosító belső rendszere, ahol 10+ fejlesztő dolgozik évekig ugyanazon a kódon.'],
'Svelte':['Nem hagyományos keretrendszer, hanem <b>fordító (compiler)</b>: build közben a kódodat sima, optimalizált JavaScriptté alakítja, így futáskor szinte nincs keretrendszer-többlet.','gyors, kis méretű webappok, interaktív oldalak, látványos felületek.','A fordító megnézi, melyik változó melyik DOM-részt érinti, és <b>pontosan azt a frissítő kódot generálja</b>. Nincs virtuális DOM-összehasonlítás, ezért kevesebb munkát végez a böngésző.','kevés kód, beépített reaktivitás ($state), .svelte fájlok, beépített animációk; a SvelteKit adja az útválasztást és az SSR-t.','kis csomagméret és gyors működés; nagyon tömör, olvasható kód; élvezetes tanulni.','kisebb ökoszisztéma és kevesebb állás; a fordító „varázslata” néha nehezíti a hibakeresést.','gyors, mobilon is jól futó kisebb app vagy interaktív bemutató, ahol számít a sebesség.'],
'Next.js':['A Reactre épülő <b>full-stack keretrendszer</b> (a Vercel fejleszti). A Reacthez hozzáadja, ami hiányzik: útválasztást, szerveroldali renderelést és háttérlogikát (API).','SEO-barát weboldalak, webshopok, blogok, teljes webappok egyetlen projektben.','A fájlok mappaszerkezete adja az URL-eket. Az oldalt a <b>szerver előre legenerálja HTML-ként</b> (<b>SSR</b>), így gyorsan megjelenik és a keresők is látják; utána a React „életre kelti” a böngészőben.','fájlalapú router (App Router), SSR és SSG (statikus generálás build időben), szerverkomponensek, API route-ok, képoptimalizálás.','gyors első betöltés és jó SEO; egy helyen van a frontend és a backend; a React-tudás közvetlenül használható.','összetett és gyorsan változó (sok új fogalom); egyes funkciók a Vercel platformon a legkényelmesebbek.','webshop vagy hirdetésből élő oldal, ahol a Google-találat és a gyors betöltés számít.'],
'Nuxt':['A <b>Vue</b>-hoz készült full-stack keretrendszer, ugyanaz a szerepe, mint a Next.js-nek a Reactnél. Sok mindent magától elintéz, így kevés a beállítás.','SEO-barát Vue-s oldalak, blogok, webshopok, teljes webappok.','A <b>pages/</b> mappába tett .vue fájlokból automatikusan útvonal lesz. A Nuxt szerveren vagy build időben elkészíti a HTML-t, a böngészőben a Vue veszi át az irányítást.','fájlalapú router, <b>auto-import</b> (nem kell kézzel importálni), SSR/SSG, modulrendszer, beépített szerver (Nitro).','kevés beállítással gyorsan indul; megtartja a Vue egyszerűségét; jó fejlesztői élmény.','csak Vue-val használható; kisebb közösség és kevesebb tananyag, mint a Next.js-nél.','egy Vue-s csapat elkészíti a cég blogját vagy termékoldalait jó keresőoptimalizálással.'],
'Remix':['React-alapú full-stack keretrendszer, ami a <b>webes alapokra</b> épít: URL-ek, űrlapok, HTTP. Ma már a <b>React Router 7</b> része, ugyanaz a csapat viszi tovább.','adat- és űrlapközpontú appok: rendelések, profilok, szerkesztőfelületek.','Minden útvonalhoz tartozik egy <b>loader</b> (a szerver ezzel tölti be az adatot) és egy <b>action</b> (ez dolgozza fel az elküldött űrlapot). Az adatok párhuzamosan érkeznek, az űrlap sima HTML-űrlapként is működik.','beágyazott útvonalak, loader és action, hibakezelés útvonalanként, szerveroldali renderelés.','egyszerű, átlátható adatkezelés; JavaScript nélkül is működő űrlapok; kevés kliensoldali kód.','kisebb közösség és kevesebb tananyag, mint a Next.js-nél; az átnevezések miatt zavaró lehet.','sok űrlapot és listát kezelő üzleti app, ahol fontos az egyszerű adatáramlás.'],
'Astro':['<b>Tartalomközpontú</b> keretrendszer: alapból <b>nulla JavaScriptet</b> küld a böngészőnek, csak ahol tényleg kell. Ez teszi villámgyorssá a tartalmas oldalakat.','blogok, dokumentációk, marketingoldalak, portfóliók, céges bemutatkozó oldalak.','Az oldal build időben <b>kész HTML-lé</b> alakul. Az interaktív részek (pl. keresőmező) külön <b>szigetek</b> (islands architecture): csak azok kapnak JavaScriptet, a többi statikus marad.','.astro fájlok, Markdown és MDX támogatás, React/Vue/Svelte komponensek keverhetők, <code>client:</code> direktívák a betöltés vezérlésére.','kiváló sebesség és SEO; több keretrendszer együtt használható; egyszerű tartalomkezelés.','erősen interaktív, sok állapotot kezelő appokhoz nem ideális.','céges weboldal vagy blog, ahol néhány interaktív elem (pl. képgaléria) mellett főleg tartalom van.'],
'Alpine.js':['Pár kilobájtos könyvtár, amivel <b>közvetlenül a HTML-be írt attribútumokkal</b> adhatsz interaktivitást. Nincs build lépés, csak beteszel egy script-tag-et.','apró interakciók: lenyíló menü, felugró ablak (modal), fülek, egyszerű szűrők.','Az <code>x-data</code> attribútummal megadod az elem adatait, a többi attribútum (<code>x-show</code>, <code>@click</code>) ezekhez kötődik. Az Alpine figyeli az adatot, és ennek megfelelően mutat vagy rejt elemeket.','<code>x-data</code>, <code>x-show</code>, <code>x-model</code>, <code>@click</code>; nincs build eszköz; a Vue-hoz hasonló szintaxis; nagyon kicsi.','percek alatt kipróbálható; nem kell átalakítani a projektet; jó pár szerveroldali oldalhoz (Laravel, WordPress).','nagy, összetett appokhoz nem való; kevés beépített szerkezet a kód rendezéséhez.','meglévő, szerveren renderelt oldalra kell lenyíló menü és modal, de nem akarsz teljes keretrendszert.'],
'htmx':['Attribútumokkal <b>szerverrel beszélgető HTML</b>: a szerver kész HTML-darabot küld vissza, a htmx pedig beilleszti az oldalba, teljes újratöltés nélkül.','dinamikus oldalak JS írása nélkül: élő keresés, „továbbiak betöltése”, űrlapok, admin felületek.','A <code>hx-get</code> megmondja, melyik URL-t hívja meg, a <code>hx-target</code> pedig azt, hová kerüljön az eredmény. A szerver nem JSON-t, hanem <b>HTML-t</b> ad vissza, a htmx ezt cseréli be.','<code>hx-get</code>, <code>hx-post</code>, <code>hx-target</code>, <code>hx-swap</code>; nincs build, ~14 KB; bármilyen backenddel működik (Python, PHP, Go, Java).','nagyon egyszerű, kevés JavaScriptet kell írni; a logika a szerveren marad; gyorsan fejleszthető.','összetett kliensoldali logikát (pl. szerkesztő) nehezen kezel; minden interakció szerverkérés.','szerveroldali (pl. Django vagy Laravel) admin felület élő kereséssel és részleges frissítéssel.'],
'Preact':['A React <b>3 KB-os</b> kistestvére. Szinte ugyanaz az API, de töredék méretben.','könnyű, React-szerű appok, beágyazható widgetek, lassú hálózaton futó oldalak.','Ugyanúgy komponenseket és hookokat írsz, mint Reactben, de belül egyszerűbb, kisebb megvalósítás fut. A <b>preact/compat</b> réteggel a legtöbb React-könyvtár is működik.','React-szerű komponensek és hookok, ~3 KB méret, gyors, Signals opció, kompatibilitási réteg.','kicsi, gyors betöltés; a React-tudás azonnal használható; könnyen átváltható Reactről.','kisebb ökoszisztéma; néhány újabb React-funkció hiányzik vagy eltér.','chat-widget vagy hirdetési modul, amit más oldalakba kell beágyazni kis mérettel.'],
'Lit':['Kis könyvtár (<b>~5 KB</b>) a <b>Web Components</b>-hez: saját HTML-elemeket készíthetsz, amik <b>bármely keretrendszerben</b> (vagy anélkül) működnek.','újrahasználható felületi elemek, cégen belüli design system (közös gomb, űrlapmező, kártya).','Egy osztályt írsz, ami böngészőszabvány szerint regisztrál egy saját elemet (<code>&lt;my-btn&gt;</code>). A <b>Shadow DOM</b> elszigeteli a stílust, a Lit pedig reaktív property-kkel gondoskodik a frissítésről.','böngészőszabványra épül, Shadow DOM, reaktív property-k, sablonok, keretrendszertől független.','ugyanaz az elem Reactben, Vue-ban és sima HTML-ben is használható; hosszú távon stabil; kicsi.','kevesebb kényelmi eszköz és tananyag; a Shadow DOM miatt a stílusozás és tesztelés néha trükkösebb.','egy cég több csapata más-más keretrendszerben dolgozik, de ugyanazt a gomb- és űrlapkészletet akarják.']};
const card=(n,lead,r,code)=>{const B=BIG[n];if(B){lead=B[0];r=B.slice(1)}return `<div class="c"><h3>${n}</h3><p class="lead">${lead}</p><ul><li><b>Mire:</b> ${r[0]}</li><li><b>Hogyan működik:</b> ${r[1]}</li><li><b>Fő jellemzők:</b> ${r[2]}</li><li><b>Előnyök:</b> ${r[3]}</li><li><b>Hátrányok:</b> ${r[4]}</li><li><b>Mikor érdemes:</b> ${r[5]}</li></ul><pre>${esc(code)}</pre></div>`};
